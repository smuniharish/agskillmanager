[project]
site_name = "skill-manager"
site_description = "Governed, framework-agnostic Skill lifecycle management for AI agents."
site_url = "https://skill-manager.readthedocs.io/en/latest/"
site_author = "smuniharish"
repo_name = "smuniharish/skill-manager"
repo_url = "https://github.com/smuniharish/skill-manager"
edit_uri = "edit/master/docs/"
copyright = "Copyright &copy; skill-manager contributors. Apache License 2.0."
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
    { "Configuration" = "getting-started/configuration.md" },
  ] },
  { "User guide" = [
    { "Skills and bundles" = "guide/skills.md" },
    { "Governance and feedback" = "guide/governance.md" },
    { "Sources and storage" = "guide/storage.md" },
    { "Discovery and dependencies" = "guide/discovery.md" },
    { "Refresh and operations" = "guide/operations.md" },
    { "Troubleshooting" = "guide/troubleshooting.md" },
  ] },
  { "Integrations" = [
    { "Downstream customization" = "integrations/customization.md" },
    { "Agent frameworks" = "integrations/frameworks.md" },
    { "OpenTelemetry and agxai" = "integrations/observability.md" },
  ] },
  { "Examples" = "examples/index.md" },
  { "Architecture" = "architecture/index.md" },
  { "Agent Skills" = "agent-skills/index.md" },
  { "Security" = "security.md" },
  { "Benchmarks" = "benchmarks.md" },
  { "API reference" = [
    { "Manager and configuration" = "api/manager.md" },
    { "Domain models" = "api/models.md" },
    { "Extension points" = "api/extensions.md" },
    { "Optional integrations" = "api/integrations.md" },
    { "Testing and errors" = "api/testing.md" },
  ] },
  { "Project" = "development/index.md" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true
unresolved_references = true
unresolved_footnotes = true
unused_definitions = true
unused_footnotes = true
shadowed_definitions = true
shadowed_footnotes = true

[project.theme]
font = false
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
icon.repo = "fontawesome/brands/github"
features = [
  "content.code.copy", "content.action.edit", "navigation.footer",
  "navigation.instant", "navigation.sections", "navigation.tabs",
  "navigation.top", "search.highlight", "search.suggest", "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/smuniharish/skill-manager"
name = "skill-manager on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/skill-manager/"
name = "skill-manager on PyPI"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
extensions = [{ griffe_pydantic = { schema = false } }]
show_source = false
show_root_heading = true
show_root_full_path = false
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
members_order = "source"
heading_level = 3

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
