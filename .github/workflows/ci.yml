name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pyrefly check

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skill_manager
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SKILL_MANAGER_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/skill_manager
      SKILL_MANAGER_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/skill_manager
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run --no-sync pytest --cov --cov-report=term-missing

  lowest:
    name: Lowest supported direct dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --resolution lowest-direct --all-extras --all-groups
      - run: uv run --no-sync pytest -m "not live"

  package:
    name: Build and verify the core wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Run without LangChain or LangGraph
        run: |
          uv venv --no-project "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl
          "$RUNNER_TEMP/wheel/bin/python" -c "import importlib.util; import skill_manager; assert importlib.util.find_spec('langchain_core') is None; assert importlib.util.find_spec('langgraph') is None; assert skill_manager.__version__ == '1.0.0'"
          "$RUNNER_TEMP/wheel/bin/python" examples/custom_framework.py
          "$RUNNER_TEMP/wheel/bin/python" agskillmanager-skills/skills/agskillmanager/scripts/verify_setup.py
          "$RUNNER_TEMP/wheel/bin/python" agskillmanager-skills/skills/agskillmanager-extend/scripts/check_source.py source_template:MemorySkillSource --path agskillmanager-skills/skills/agskillmanager-extend/assets

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --locked --group docs --all-extras
      - run: uv run --no-sync zensical build --strict
      - run: uv run --no-sync python scripts/check_site_links.py
